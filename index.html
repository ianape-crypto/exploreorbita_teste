<style id="gmHeroPlus">
/* menos espaço entre banner e Indicações */
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero { padding-bottom: 6px !important; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmMenu > .gm-grp:first-of-type { margin-top: 16px !important; }
/* ===== Banner: melhorias (movimento, balão, números, selo, ajustes) ===== */
/* menu de categorias numa linha só */
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmChips { gap: 6px !important; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmChips .gm-chip { font-size: 12px !important; padding-left: 11px !important; padding-right: 11px !important; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmTop.home-top-row { gap: 10px !important; }
/* menos espaço entre menu e logo */
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero { padding-top: 40px !important; }
/* botão principal afunda na sombra */
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-cta:hover { transform: translate(3px,3px) !important; box-shadow: 2px 2px 0 #201f1c !important; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-cta:active { transform: translate(5px,5px) !important; box-shadow: 0 0 0 #201f1c !important; }
/* números */
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-stats { list-style: none; margin: 26px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px 0; font-size: 15px; color: #201f1c; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-stats li { display: inline-flex; align-items: baseline; gap: 5px; white-space: nowrap; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-stats li + li::before { content: "·"; margin: 0 12px; font-weight: 800; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-stats b { font-family: "Baloo 2", sans-serif; font-weight: 800; font-size: 20px; }
/* mascote flutuando */
@keyframes orbFloat { 0%,100% { translate: 0 0; } 50% { translate: 0 -10px; } }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-mascot { animation: orbFloat 4.5s ease-in-out infinite; }
/* estrelas piscando */
@keyframes orbTwinkle { 0%,100% { opacity: 1; rotate: 0deg; } 50% { opacity: .35; rotate: 18deg; } }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-sp { animation: orbTwinkle 3s ease-in-out infinite; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-sp.hs2 { animation-duration: 3.8s; animation-delay: -1.2s; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-sp.hs3 { animation-duration: 2.6s; animation-delay: -.6s; }
/* planeta na órbita */
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero.orbit-svg::before { border-color: transparent !important; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-orbit { position: absolute; pointer-events: none; z-index: 1; display: block; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-orbit svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-mascot-wrap { z-index: 2; }
/* balão de fala */
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-bubble { position: absolute !important; left: -6px; top: 6px; z-index: 4; margin: 0 !important;
  background: #F8F3E6 !important; color: #201f1c !important; border: 2px solid #201f1c !important; border-radius: 16px !important;
  box-shadow: 3px 3px 0 #201f1c !important; padding: 7px 14px !important; min-height: 0 !important; width: auto !important;
  font-family: "Baloo 2", sans-serif !important; font-weight: 800 !important; font-size: 16px !important; line-height: 1.15 !important;
  text-transform: none !important; letter-spacing: 0 !important; white-space: nowrap; cursor: pointer;
  animation: orbPop .45s cubic-bezier(.3,1.6,.5,1) both .4s; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-bubble::before, html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-bubble::after { content: "" !important; display: block !important; position: absolute !important; width: 0 !important; height: 0 !important; background: none !important; border-style: solid !important; box-shadow: none !important; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-bubble::before { right: 18px; bottom: -12px; border-width: 12px 0 0 12px !important; border-color: #201f1c transparent transparent transparent !important; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-bubble::after { right: 20px; bottom: -8px; border-width: 9px 0 0 9px !important; border-color: #F8F3E6 transparent transparent transparent !important; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-bubble:hover { background: #F4BE2A !important; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .hero-bubble:hover::after { border-top-color: #F4BE2A !important; }
@keyframes orbPop { from { opacity: 0; scale: .6; } to { opacity: 1; scale: 1; } }
/* selo Try me de volta */
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero button#surpriseStamp#surpriseStamp#surpriseStamp#surpriseStamp.surprise-stamp { display: block !important; position: absolute !important; inset: auto -70px 6px auto !important; top: auto !important; left: auto !important; width: 104px !important; height: 104px !important; z-index: 3 !important; }
html body #tabGames#tabGames#tabGames#tabGames#tabGames #gmHead #gmHero .surprise-stamp:hover { scale: 1.06; }
/* celular */

<script>
(function(){
  var PHRASES=["Ready to play?","Let's explore!","Pick a game!","Practice makes progress!","Let's learn together!","You can do it!","Game on!"];
  var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function $(q){return document.querySelector(q);}
  // balão: frase aleatória, clique troca
  var bub=$('#heroBubble'), idx=Math.floor(Math.random()*PHRASES.length);
  function say(i){ if(!bub) return; bub.textContent=PHRASES[i]; bub.style.animation='none'; void bub.offsetWidth; bub.style.animation=''; }
  if(bub){ say(idx); bub.addEventListener('click',function(){ idx=(idx+1)%PHRASES.length; say(idx); }); }
  // planeta na órbita: copia a geometria da linha tracejada
  var hero=$('#gmHero'), orb=$('#gmHero .hero-orbit'), svgNS='http://www.w3.org/2000/svg';
  function buildOrbit(){
    if(!hero||!orb) return;
    if(!hero.offsetWidth||!hero.offsetHeight||!hero.getClientRects().length) return;
    var cs=getComputedStyle(hero,'::before');
    if(cs.display==='none'||cs.content==='none'){ orb.style.display='none'; return; }
    orb.style.display='';
    var bw=parseFloat(cs.borderTopWidth)||0, bb=cs.boxSizing==='border-box';
    var w=parseFloat(cs.width)+(bb?0:2*bw), h=parseFloat(cs.height)+(bb?0:2*bw); if(!w||!h) return;
    ['top','left','transform','translate','scale','rotate','transformOrigin'].forEach(function(p){ orb.style[p]=cs[p]; });
    orb.style.right='auto'; orb.style.bottom='auto'; orb.style.width=w+'px'; orb.style.height=h+'px';
    hero.classList.add('orbit-svg');
    var rx=w/2-bw/2, ry=h/2-bw/2, cx=w/2, cy=h/2, op=parseFloat(cs.opacity)||1;
    var d='M'+(cx+rx)+','+cy+' A'+rx+','+ry+' 0 1,1 '+(cx-rx)+','+cy+' A'+rx+','+ry+' 0 1,1 '+(cx+rx)+','+cy;
    orb.innerHTML='<svg xmlns="'+svgNS+'" viewBox="0 0 '+w+' '+h+'"><ellipse cx="'+cx+'" cy="'+cy+'" rx="'+rx+'" ry="'+ry+'" fill="none" stroke="#201f1c" stroke-opacity="'+op+'" stroke-width="'+(bw||2)+'" stroke-dasharray="6 5"/><g><circle r="11" fill="#D7262E" stroke="#201f1c" stroke-width="2.5"/><ellipse rx="19" ry="5.5" fill="none" stroke="#201f1c" stroke-width="2.5" transform="rotate(-20)"/>'+
      '<animateMotion dur="16s" repeatCount="indefinite" path="'+d+'"/></g></svg>';
    var svg=orb.querySelector('svg'); if(reduce&&svg&&svg.pauseAnimations) svg.pauseAnimations();
  }
  // números: conta jogos e categorias de verdade
  function countStats(){
    var m=$('#gmMenu'); if(!m) return false;
    var picks=m.querySelectorAll('.gm-pick[data-k]'); if(!picks.length) return false;
    var keys={}; picks.forEach(function(p){ keys[p.getAttribute('data-k')]=1; });
    var cats=m.querySelectorAll('.gm-grpgrid:not([data-home="5"])').length;
    var g=$('[data-hs="games"]'), c=$('[data-hs="cats"]');
    if(g) g.textContent=Object.keys(keys).length; if(c&&cats) c.textContent=cats;
    return true;
  }
  function moveStamp(){ var st=$('#surpriseStamp'), bt=$('#gmHero .brand-text'); if(st&&bt&&st.parentNode!==bt) bt.appendChild(st); }
  function init(){ buildOrbit(); if(!countStats()){ var n=0, t=setInterval(function(){ if(countStats()||++n>40) clearInterval(t); },250); } }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){ setTimeout(init,50); }); else setTimeout(init,50);
  window.addEventListener('load',buildOrbit);
  try{ if(window.ResizeObserver&&hero){ var lw=0; new ResizeObserver(function(){ var w=hero.offsetWidth; if(w&&w!==lw){ lw=w; clearTimeout(rt); rt=setTimeout(buildOrbit,60); } else if(!w) lw=0; }).observe(hero); } if(document.fonts&&document.fonts.ready) document.fonts.ready.then(function(){ setTimeout(buildOrbit,50); }); }catch(e){}
  var rt; window.addEventListener('resize',function(){ clearTimeout(rt); rt=setTimeout(buildOrbit,150); });
})();
</script>

html body #tabGames#tabGames#tabGames#tabGames#tabGames#tabGames #gmStage #gmBody .me-btns button { width: 100% !important; max-width: none !important; margin: 0 !important; display: flex !important; justify-content: center !important; }

<script>
(function(){
  /* ---------- utilidades ---------- */
  function G(){ try{ return gm; }catch(e){ return null; } }
  function esc(x){ return String(x==null?'':x).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function strip(h){ var d=document.createElement('div'); d.innerHTML=String(h==null?'':h); return (d.textContent||'').replace(/\s+/g,' ').trim(); }
  function say(txt){ try{ var u=new SpeechSynthesisUtterance(txt); u.lang='en-US'; u.rate=.9; var v=speechSynthesis.getVoices().filter(function(v){return /^en(-|_)US/i.test(v.lang);})[0]; if(v) u.voice=v; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
  window.meSay=say;
  var session=null, mem={miss:{}}, qlog=[], qmap={}, seen=[], seenKeys={};
  function curSession(){ var g=G(); var s=g&&g.state; if(s!==session){ session=s; mem={miss:{}}; qlog=[]; qmap={}; seen=[]; seenKeys={}; } return g; }

  /* ---------- Memória: registra erros ---------- */
  function wrapTap(){
    var orig=window.gmMemTap; if(!orig||orig.__me) return !!orig;
    var w=function(i){ var g=curSession(), s=g&&g.state, first=s?s.first:null; var r=orig.apply(this,arguments);
      try{ if(s&&first!=null&&first!==i&&s.cards[first]&&s.cards[i]&&s.cards[first].k!==s.cards[i].k){ mem.miss[s.cards[first].k]=1; mem.miss[s.cards[i].k]=1; } }catch(e){} return r; };
    w.__me=1; window.gmMemTap=w; return true;
  }
  if(!wrapTap()){ var n0=0, t0=setInterval(function(){ if(wrapTap()||++n0>40) clearInterval(t0); },250); }

  /* ---------- registro de perguntas de múltipla escolha ---------- */
  function promptInfo(btn){
    var main=btn.closest('main')||document.getElementById('gmBody'); if(!main) return {txt:'',html:''};
    var q=main.querySelector('.gm-q')||main.querySelector('.gm-fall')||main.querySelector('.tv-en');
    if(q&&q.classList.contains('tv-en')){ var pt=main.querySelector('.tv-pt'); return {txt:strip(q.innerHTML)+(pt?' = '+strip(pt.innerHTML):''), html:'', tf:true}; }
    if(!q){ var li=main.querySelectorAll('.gm-clist li'); if(li.length) return {txt:strip(li[0].innerHTML),html:''}; return {txt:'',html:''}; }
    return {txt:strip(q.innerHTML), html:q.innerHTML, blank:!!q.querySelector('.gm-blank')||/_{3,}/.test(q.textContent)};
  }
  document.addEventListener('click',function(e){
    var btn=e.target.closest&&e.target.closest('#gmBody .gm-opt, #gmBody .tv-a'); if(!btn||btn.disabled) return;
    var g=curSession(); if(!g) return;
    var pi=promptInfo(btn), picked=strip(btn.innerHTML);
    var wrap=btn.parentNode;
    setTimeout(function(){
      try{
        var isTv=btn.classList.contains('tv-a');
        var okEl=wrap.querySelector(isTv?'.tv-a.correct':'.gm-opt.ok');
        var good=isTv?btn.classList.contains('correct'):btn.classList.contains('ok');
        var bad=isTv?(!good&&!!okEl):btn.classList.contains('no');
        if(!good&&!bad) return;
        var correct=okEl?strip(okEl.innerHTML):(good?picked:'');
        var fbEl=(btn.closest('main')||document).querySelector(isTv?'.tv-fb':'#gmFb');
        var note=fbEl?strip(fbEl.innerHTML).replace(/^(certo|isso|boa|acertou|muito bem|correto|correct|right|nice|great|not quite|errou|ops|quase|ainda não)[!.:,]*\s*/i,''):'';
        var key=pi.txt+'|'+correct;
        var it=qmap[key];
        if(!it){ it={prompt:pi.txt, html:pi.html, blank:pi.blank, tf:pi.tf, correct:correct, note:note, status:'ok'}; qmap[key]=it; qlog.push(it); }
        if(bad) it.status='rev';
        if(note&&!it.note) it.note=note;
      }catch(err){}
    },140);
  },true);

  /* ---------- registro do que apareceu (jogos com "cur") ---------- */
  setInterval(function(){
    var g=curSession(); if(!g||!g.state) return; var s=g.state, c=s.cur;
    if(typeof c==='number'&&c>=0&&s.pool) c=s.pool[c];
    if(c&&typeof c==='object'&&(c.en||c.q)){ var k=(c.en||'')+'|'+(c.q||''); if(!seenKeys[k]){ seenKeys[k]=1; seen.push(c); } }
  },300);

  /* ---------- montar itens por jogo ---------- */
  function pair(en,pt,o){ o=o||{}; return {main:en, sub:pt, arrow:true, say:o.say!==undefined?o.say:en, note:o.note||'', status:o.status||''}; }
  function poolFind(s,word){ var all=[].concat(s.pool||[],s.words||[],s.items||[]); for(var i=0;i<all.length;i++){ var x=all[i]; if(x&&x.en&&x.en.toLowerCase()===String(word).toLowerCase()) return x; } return null; }
  function fromQlog(s){
    return qlog.map(function(q){
      var p=poolFind(s,q.correct);
      if(p) return pair(p.en,p.pt,{status:q.status});
      if(q.tf) return {main:q.prompt, sub:q.note, say:q.prompt.split(' = ')[0], status:q.status};
      if(q.blank&&q.html){ var d=document.createElement('div'); d.innerHTML=q.html; var b=d.querySelector('.gm-blank'); var sent; var TOK='\u0001'; if(b){ b.textContent=TOK; sent=(d.textContent||'').replace(/\s+/g,' ').trim(); } else sent=q.prompt.replace(/_{3,}/,TOK); var hp=sent.split(TOK); var html=esc(hp[0])+'<b class="me-hl">'+esc(q.correct)+'</b>'+esc(hp.slice(1).join(q.correct)); sent=hp.join(q.correct); return {main:sent, mainHtml:html, sub:'', note:q.note, say:sent, status:q.status, long:true}; }
      var generic=/^(qual|que|quanto|quantos|como|ouça|o que|escolha|toque|which|what)/i.test(q.prompt);
      if(generic||!q.prompt) return {main:q.correct, sub:q.prompt, note:q.note, say:q.correct, status:q.status};
      return {main:q.correct, sub:q.prompt, arrow:true, note:q.note, say:q.correct, status:q.status};
    });
  }
  function upto(arr,n,done){ arr=arr||[]; if(done||n==null) return arr; return arr.slice(0,Math.min(arr.length,n+1)); }
  function byIndexStatus(items){ items.forEach(function(it,i){ if(qlog[i]&&!it.status) it.status=qlog[i].status; }); return items; }
  var A={
    memory:function(s){ var pairs={}; (s.cards||[]).forEach(function(c){ (pairs[c.k]=pairs[c.k]||{})[c.t]=c.txt; });
      return Object.keys(pairs).map(function(k){ return pair(pairs[k].en,pairs[k].pt,{status:mem.miss[k]?'rev':'ok'}); }); },
    wordsearch:function(s){ return (s.words||[]).map(function(w){ return pair(w.en,w.pt,{status:w.found?'ok':'rev'}); }); },
    crossword:function(s){ return (s.words||[]).map(function(w){ return pair(w.en,w.pt); }); },
    hangman:function(s){ return upto(s.words,s.i,s.done).map(function(w){ return pair(w.en,w.pt); }); },
    anagram:function(s){ return upto(s.words,s.n,s.done).map(function(w){ return pair(w.en,w.pt); }); },
    novowel:function(s){ return upto(s.items,s.n,s.done).map(function(w){ return pair(w.en,w.pt); }); },
    dictation:function(s){ return upto(s.words,s.n,s.done).map(function(w){ return pair(w.en,w.pt); }); },
    hidden:function(s){ return upto(s.items,s.n,s.done).map(function(w){ return pair(w[0],w[1]); }); },
    whoami:function(s){ var it=upto(s.items,s.n,s.done).map(function(w){ return pair(w[0],w[1]); }); return byIndexStatus(it); },
    truefalse:function(s){ var it=upto(s.items,s.n).map(function(w){ return pair(w.en,w.pt,{note:w.ok?'':strip(w.why)}); }); return byIndexStatus(it); },
    detective:function(s){ return byIndexStatus(upto(s.items,s.n).map(function(w){ var ws=String(w[0]).split(' '); var bad=ws[w[1]]; ws[w[1]]=w[2]+((bad||'').match(/[.,!?;:]+$/)||[''])[0]; var sent=ws.join(' '); return {main:sent, note:strip(w[4]), say:sent, long:true}; })); },
    saytell:function(s){ return byIndexStatus(upto(s.items,s.n).map(function(w){ var parts2=String(w[0]).split(/_{2,}/); var sent=parts2.join(w[1]); return {main:sent, mainHtml:esc(parts2[0])+'<b class="me-hl">'+esc(w[1])+'</b>'+esc(parts2.slice(1).join(w[1])), note:strip(w[3]), say:sent, long:true}; })); },
    punct:function(s){ return upto(s.items,s.n,s.done).map(function(w){ return {main:w[0], note:strip(w[1]), say:w[0], long:true}; }); },
    audioerr:function(s){ return upto(s.items,s.n).map(function(w){ return {main:w[0], note:'O áudio trocou “'+w[1]+'” por “'+w[2]+'”.', say:w[0], long:true}; }); },
    sortcat:function(s){ return upto(s.queue,s.i).map(function(w){ return {main:w[0], sub:w[1], arrow:true, say:w[0]}; }); },
    bomb:function(s){ return Object.keys(s.used||{}).map(function(w){ return {main:w, sub:s.cat||'', say:w, status:'ok'}; }); },
    chain:function(s){ var d=(s.d&&s.d.pt)||{}; return (s.chain||[]).filter(function(c){ return c.who!=='bot'; }).map(function(c){ return pair(c.w,d[c.w]||''); }); },
    boggle:function(s){ return (s.found||[]).map(function(w){ return {main:typeof w==='string'?w:(w.w||w.en||''), say:typeof w==='string'?w:(w.w||w.en||''), status:'ok'}; }); },
    scrabble:function(s){ return (s.played||[]).map(function(w){ var t=typeof w==='string'?w:(w.w||w.word||''); return {main:t, sub:w&&w.pts?w.pts+' pontos':'', say:t, status:'ok'}; }).filter(function(x){return x.main;}); },
    story:function(s){ return (s.lines||[]).map(function(l){ return {main:l, say:l, long:true}; }); },
    vtheme:function(s){ return (s.log||[]).map(function(w){ return pair(w.en,w.pt,{status:w.status}); }); },
    vorder:function(s){ return (s.log||[]).map(function(w){ return pair(w.en,w.pt,{status:w.status}); }); },
    vsolve:function(s){ return (s.log||[]).map(function(w){ return pair(w.en,w.pt,{status:w.status}); }); },
    vpack:function(s){ return (s.log||[]).map(function(w){ return pair(w.en,w.pt,{status:w.status}); }); },
    vlink:function(s){ return (s.log||[]).map(function(w){ return pair(w.en,w.pt,{status:w.status}); }); },
    vinst:function(s){ return (s.log||[]).map(function(w){ return pair(w.en,w.pt,{status:w.status}); }); },
    half:function(s){ var out=[]; (s.sets||[]).slice(0,(s.r||0)+1).forEach(function(set){ (set[2]||[]).forEach(function(p){ var t=p[0]+' '+p[1]; out.push({main:t, say:t, long:true}); }); }); return out; }
  };
  var TITLES={vorder:'Itens dos pedidos',vsolve:'Soluções',vpack:'Itens da mala',vlink:'Pares ligados',vtheme:'Palavras da rodada',vinst:'Palavras revisadas',stop:'Suas respostas',memory:'Pares da rodada',wordsearch:'Palavras da grade',crossword:'Palavras da cruzada',story:'Sua história',half:'Frases completas',bomb:'Palavras que você disse',chain:'Suas palavras',boggle:'Palavras que você formou',scrabble:'Palavras no tabuleiro',sortcat:'Palavras e categorias',detective:'Frases corrigidas',saytell:'Frases completas',punct:'Frases pontuadas',audioerr:'Frases ouvidas'};
  function itemsFor(g){
    var s=g.state||{}, k=g.game, out=[];
    try{ if(A[k]) out=A[k](s)||[]; }catch(e){ out=[]; }
    if(!out.length&&qlog.length) out=fromQlog(s);
    if(!out.length&&seen.length) out=seen.map(function(c){ return c.en?pair(c.en,c.pt):{main:c.correct||'',sub:strip(c.q||''),say:c.correct||''}; });
    var dedup={}; out=out.filter(function(x){ if(!x||!x.main) return false; var key=x.main+'|'+(x.sub||''); if(dedup[key]) return false; dedup[key]=1; return true; });
    out.forEach(function(x){ var nm=function(t){ return String(t||'').toLowerCase().replace(/[^a-z0-9à-ú]+/gi,''); }; if(x.note&&(nm(x.note)===nm(x.main)||nm(x.note)===nm(x.sub))) x.note=''; });
    if(out.length>1){ var s0=out[0].sub; if(s0&&out.every(function(x){ return x.sub===s0; })) out.forEach(function(x){ x.sub=''; }); }
    return out;
  }

  /* ---------- montar a tela ---------- */
  function build(end){
    var g=curSession(); if(!g||g.game==='escape') return;
    var big=end.querySelector('.gm-big'), bigTxt=big?big.textContent.trim():'';
    var p=end.querySelector('p'), pClone=p?p.cloneNode(true):null, extraMuted='';
    var rec=p?/recorde/i.test(p.textContent):false;
    if(pClone){ [].slice.call(pClone.querySelectorAll('.muted')).forEach(function(m){ extraMuted+=(extraMuted?' ':'')+m.innerHTML; m.remove(); }); [].slice.call(pClone.querySelectorAll('b')).forEach(function(b){ if(/recorde/i.test(b.textContent)) b.remove(); }); }
    var label=pClone?strip(pClone.innerHTML).replace(/[·\s]+$/,'').replace(/^[·\s]+/,''):'';
    var parts=label.split(/\s*·\s*/).filter(Boolean);
    var starsEl=end.querySelector('.gm-stars'), nStars=starsEl?starsEl.querySelectorAll('.on').length:0;
    var lv=(end.querySelector('.gm-lvchip')||{}).textContent||'';
    var emoEl=end.querySelector('.gm-emo, .gm-end-emo'); var emo=emoEl?emoEl.textContent.trim():'';
    var known=[big,p,starsEl,end.querySelector('.gm-lvchip'),end.querySelector('.gm-row'),emoEl];
    var extras=[].slice.call(end.children).filter(function(c){ return known.indexOf(c)<0; });
    var title=nStars>=3?'Perfeito!':nStars===2?'Mandou bem!':nStars===1?'Boa, continue!':'Bora de novo!';
    var sub=nStars>=3?'Resultado de mestre. Continue assim!':nStars===2?'Você foi muito bem nessa rodada.':nStars===1?'Cada rodada fixa mais o inglês. Tente de novo!':'Errar faz parte: a próxima rodada vai ser melhor.';
    var k=g.game, items=(k==='escape'||k==='fuga')?[]:itemsFor(g);
    var stats=[];
    if(k==='memory'){
      var s=g.state||{}, mv=bigTxt||s.moves, tm=(label.match(/em\s*(\d+)\s*s/)||[])[1]||'';
      var tot=s.total||items.length, acc=mv?Math.round(100*tot/mv):0;
      sub=nStars>=3?'Memória afiada: quase nenhuma volta à toa.':nStars===2?'Você lembrou da maioria dos pares de primeira.':'Cada rodada fixa mais as palavras. Bora de novo?';
      stats=[[mv,'jogadas',1],[tm?tm+'s':'—','tempo'],[acc+'%','precisão']];
    } else {
      var lab0=(parts[0]||(/^\d+\s*\/\s*\d+$/.test(bigTxt)?'acertos':/^\d+$/.test(bigTxt)?'pontos':'resultado')); if(/^\d+\s*s$/.test(bigTxt)){ lab0='tempo'; } else { parts=parts.slice(1); } if(lab0.length>24){ var ws=lab0.split(' '), acc2=''; for(var wi=0;wi<ws.length;wi++){ if((acc2+' '+ws[wi]).trim().length>22) break; acc2=(acc2+' '+ws[wi]).trim(); } lab0=acc2.replace(/\s+(de|da|do|e|em|a|o)$/i,''); }
      stats.push([bigTxt||'—',lab0,1]);
      var m=/^(\d+)\s*\/\s*(\d+)$/.exec(bigTxt); if(m&&+m[2]>0) stats.push([Math.round(100*m[1]/m[2])+'%','acerto']);
      var nOk=items.filter(function(i){return i.status==='ok';}).length, nRev=items.filter(function(i){return i.status==='rev';}).length;
      if(nOk||nRev){ stats.push([nRev,'para revisar']); }
      else if(items.length){ stats.push([items.length,'praticados']); }
    }
    var restParts=(k==='memory'?parts.slice(1):parts).join(' · ');
    var nRev2=items.filter(function(i){return i.status==='rev';}).length;
    items.sort(function(a,b){ return (b.status==='rev')-(a.status==='rev'); });
    try{ if(k!=='vinst'&&k!=='vtheme'&&window.orbBankAdd) items.forEach(function(it){ if(it.status==='rev'&&it.arrow&&it.sub&&!it.long&&String(it.main).split(' ').length<=3) window.orbBankAdd(it.main,it.sub); }); }catch(e){}
    var list=items.map(function(it){
      var tag=it.status==='rev'?'<span class="me-tag">Revisar</span>':it.status==='ok'?'<span class="me-tag ok">'+(k==='memory'?'De primeira':'Acertou')+'</span>':'<span></span>';
      var sayBtn=it.say?'<button type="button" class="me-say" aria-label="Ouvir" onclick="meSay(this.dataset.w)" data-w="'+esc(it.say)+'">🔊</button>':'';
      var long=it.long||String(it.main).length>34;
      return '<li class="me-item'+(it.status==='rev'?' rev':'')+(sayBtn?'':' nosay')+'">'+sayBtn+'<div><div class="me-en'+(long?' long':'')+'">'+(it.mainHtml||esc(it.main))+'</div>'+(it.sub?'<div class="me-pt'+(it.arrow?' arrow':'')+'">'+esc(it.sub)+'</div>':'')+(it.note?'<div class="me-note">'+esc(it.note)+'</div>':'')+'</div>'+tag+'</li>';
    }).join('');
    var htitle=TITLES[k]||'O que você praticou';
    var extraHtml=items.length?'':extras.map(function(e){ return e.outerHTML; }).join('');
    var hasRight=!!(items.length||extraHtml);
    var wrap=document.createElement('div'); wrap.className='me-wrap'+(hasRight?'':' me-solo');
    var statsHtml='<div class="me-stats" style="--n:'+stats.length+'">'+stats.map(function(st){ return '<div class="me-stat'+(st[2]?' hi':'')+'"><b'+(String(st[0]).length>6?' style="font-size:20px;line-height:1.1"':'')+'>'+esc(st[0])+'</b><span>'+esc(st[1])+'</span></div>'; }).join('')+'</div>';
    wrap.innerHTML='<section class="me-card me-res">'+(rec?'<span class="me-rec">Novo recorde!</span>':'')+(emo?'<div class="me-emo">'+esc(emo)+'</div>':'')+
      (lv?'<span class="me-lv">'+esc(lv)+'</span>':'')+'<div class="me-title">'+title+'</div><p class="me-sub">'+sub+'</p>'+
      '<div class="me-starslot"></div>'+statsHtml+(restParts&&k!=='memory'?'<p class="me-min">'+esc(restParts)+'</p>':'')+(extraMuted?'<p class="me-min">'+extraMuted+'</p>':'')+'<div class="me-btns"></div></section>'+
      (hasRight?'<section class="me-card me-learn"><div class="me-h"><h3>'+esc(htitle)+'</h3><small>'+(items.length?items.length+(items.length===1?' item':' itens'):'')+(nRev2?' · '+nRev2+' para revisar':'')+'</small></div>'+
        (items.length?'<ul class="me-list">'+list+'</ul>':'')+(extraHtml?'<div class="me-extrabox">'+extraHtml+'</div>':'')+
        (items.length?'<p class="me-tip">'+(nRev2?'Os itens em amarelo deram trabalho: toque em 🔊 para ouvir e revise antes da próxima rodada.':'Toque em 🔊 para ouvir a pronúncia e fixar de vez.')+'</p>':'')+'</section>':'');
    if(starsEl) wrap.querySelector('.me-starslot').appendChild(starsEl.cloneNode(true));
    var bh=wrap.querySelector('.me-btns'), row=end.querySelector('.gm-row');
    if(row) [].slice.call(row.querySelectorAll('button')).forEach(function(b){ bh.appendChild(b); });

</style>
<script>
(function(){
  'use strict';
  var VB=null;
  var KEYS={vprog:{t:'Meu progresso',d:'Sua sequência, sua meta e tudo o que você já jogou.',emo:'🔥'},vorder:{t:'Monte o pedido',d:'Ouça o cliente e monte a bandeja com o que ele pediu.',emo:'🧾'},vsolve:{t:'Resolva o problema',d:'Leia a situação e escolha o que resolve.',emo:'💡'},vpack:{t:'Faça a mala',d:'Para cada situação, escolha os 6 itens que você levaria.',emo:'🧳'},vlink:{t:'Ligue os pares',d:'Ligue cada palavra ao seu par: profissões, opostos, filhotes e mais.',emo:'🔗'},vtheme:{t:'Vocabulário por tema',d:'Escolha um tema e pratique as palavras de vários jeitos.',emo:'🗂️'},vinst:{t:'Instrutor de vocabulário',d:'Uma palavra, duas opções: escolha a tradução certa.',emo:'🎯'}};
  var BANK_KEY='orb-bank-v1';
  function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function G(){ try{ return gm; }catch(e){ return null; } }
  function shuf(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
  function norm(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim(); }
  function speak(t){ try{ if(typeof gmSay==='function') return gmSay(t); }catch(e){} try{ var u=new SpeechSynthesisUtterance(t); u.lang='en-US'; speechSynthesis.cancel(); speechSynthesis.speak(u); }catch(e){} }
  window.ovSay=speak;
  /* ---------- banco pessoal ---------- */
  function bankGet(){ try{ return JSON.parse(localStorage.getItem(BANK_KEY)||'{}')||{}; }catch(e){ return {}; } }
  function bankSet(b){ try{ localStorage.setItem(BANK_KEY,JSON.stringify(b)); }catch(e){} }
  function bankAdd(en,pt){ if(!en||!pt) return; var b=bankGet(), k=String(en).toLowerCase(); if(!b[k]) b[k]={en:en,pt:pt,ok:0,t:Date.now()}; else { b[k].ok=0; b[k].pt=b[k].pt||pt; } bankSet(b); }
  window.orbBankAdd=bankAdd;
  function bankList(){ var b=bankGet(); return Object.keys(b).map(function(k){ return b[k]; }); }
  /* ---------- dados ---------- */
  function lvAllowed(){ var l=1; try{ l=(gmCfg&&gmCfg.lvl!=null)?gmCfg.lvl:1; }catch(e){} return l<=0?['A1']:l===1?['A1','A2']:['A1','A2','B1']; }
  function allWords(){ if(!VB) return []; var out=[]; VB.forEach(function(t){ t.words.forEach(function(w){ out.push(Object.assign({tid:t.id,tname:t.name},w)); }); }); return out; }
  /* ---------- palco ---------- */
  function headline(k){ var m=KEYS[k], ws=m.t.split(' '), h=Math.ceil(ws.length/2); return '<div class="tv-headline"><div><div class="tv-kicker">Treine inglês jogando</div><h2>'+esc(ws.slice(0,h).join(' '))+(ws.length>1?'<br>'+esc(ws.slice(h).join(' ')):'')+'</h2></div><div class="tv-cap"><span class="tv-stamp">'+esc(m.d)+'</span></div></div>'; }
  function openStage(k,cb){
    var orig=window.__ovOrigStart; orig('memory');
    var tries=0;
    (function ready(){
      var bodyEl=document.getElementById('gmBody'), g0=G();
      var okNow=bodyEl&&g0&&g0.game==='memory'&&bodyEl.querySelector('.gm-mc');
      if(!okNow&&++tries<150) return setTimeout(ready,16);
      try{ if(typeof gmStop==='function') gmStop(); }catch(e){}
      var g=G(); var st=document.getElementById('gmStage');
      if(st) st.setAttribute('data-game',k);
      var bar=st&&st.querySelector('.gm-bar');
      if(bar) bar.innerHTML='<span class="gm-chipt">'+esc(KEYS[k].t)+'</span><div class="gm-chips"><span class="gm-chip" id="ovCount">—</span><button type="button" class="gm-back" onclick="gmExit()">‹ Voltar aos jogos</button></div>';
      if(g){ g.game=k; g.state={log:[],n:0,ok:0}; }
      cb(g);
    })();
  }
  function body(k,html){ var b=document.getElementById('gmBody'); if(b) b.innerHTML='<main class="tv-main">'+headline(k)+html+'</main>'; }
  function setCount(t){ var c=document.getElementById('ovCount'); if(c) c.textContent=t; }
  function finish(k){
    var g=G(), s=g.state, tot=s.items.length;
    var b=document.getElementById('gmBody');
    try{ b.innerHTML=gmEndHtml(KEYS[k].emo,s.ok+'/'+tot,'acertos',k); }catch(e){ b.innerHTML='<div class="gm-end"><div class="gm-big">'+s.ok+'/'+tot+'</div><p>acertos</p><div class="gm-row"><button type="button" class="gm-main" onclick="gmStart(\''+k+'\')">Jogar de novo</button><button type="button" class="gm-back gm-other" onclick="gmExit()">Escolher outro jogo</button></div></div>'; }
  }
  /* ---------- perguntas ---------- */
  function makeQ(w,pool,forceMode){
    var same=pool.filter(function(x){ return x.en!==w.en&&x.pt!==w.pt&&(!w.tid||x.tid===w.tid); });
    var grp=same.filter(function(x){ return w.grp&&x.grp===w.grp; });
    var dist=shuf(grp.length>=2?grp:same.length>=2?same:pool.filter(function(x){return x.en!==w.en;}));
    var modes=forceMode?[forceMode]:['en2pt','pt2en','type','listen'];
    if(!forceMode&&w.where) modes.push('where');
    if(!forceMode&&w.opp) modes.push('opp');
    var mode=modes[Math.floor(Math.random()*modes.length)];
    var q={w:w,mode:mode};
    if(mode==='en2pt'||mode==='listen'){ q.ans=w.pt; q.opts=shuf([w.pt].concat(dist.slice(0,2).map(function(x){return x.pt;}))); }
    else if(mode==='pt2en'){ q.ans=w.en; q.opts=shuf([w.en].concat(dist.slice(0,2).map(function(x){return x.en;}))); }
    else if(mode==='where'){ q.ans=w.where; var wd=dist.filter(function(x){return x.where&&x.where!==w.where;}).map(function(x){return x.where;}); q.opts=shuf([w.where].concat(shuf(wd).slice(0,2))); if(q.opts.length<3){ q.mode='en2pt'; return makeQ(w,pool,'en2pt'); } }
    else if(mode==='opp'){ q.ans=w.opp; var od=dist.map(function(x){return x.en;}).filter(function(x){return x!==w.opp;}); q.opts=shuf([w.opp].concat(od.slice(0,2))); }
    else { q.ans=w.en; }
    return q;
  }
  var MODE_LBL={en2pt:'O que significa?',pt2en:'Como se diz em inglês?',type:'Escreva em inglês',listen:'Ouça e escolha o significado',where:'Onde essa pessoa trabalha?',opp:'Qual é o oposto?'};
  function qText(q){
    var w=q.w, m='<mark class="ov-mk">'+esc(q.mode==='pt2en'||q.mode==='type'?w.pt:w.en)+'</mark>';
    var spk=(q.mode==='pt2en'||q.mode==='type'||q.mode==='listen')?'':'<button type="button" class="ov-spk" onclick="ovSay(gm.state.cur.w.en)" aria-label="Ouvir">🔊</button>';
    if(q.mode==='solve') return '<span class="sv-q">'+esc(w.ex)+'</span><button type="button" class="ov-spk" onclick="ovSay(gm.state.cur.w.ex)" aria-label="Ouvir">🔊</button>';
    if(q.mode==='inst') return 'Qual a tradução de<br>'+m+'?'+spk;
    if(q.mode==='en2pt') return 'O que significa<br>'+m+'?'+spk;
    if(q.mode==='pt2en') return 'Como se diz<br>'+m+' em inglês?';
    if(q.mode==='type') return 'Escreva em inglês:<br>'+m;
    if(q.mode==='where') return 'Onde trabalha<br>'+m+'?'+spk;
    if(q.mode==='opp') return 'Qual é o oposto de<br>'+m+'?'+spk;
    if(q.mode==='listen') return 'Ouça e escolha<br>o significado <button type="button" class="ov-spk big" onclick="ovSay(gm.state.cur.w.en)" aria-label="Ouvir">🔊</button>';
    return m;
  }
  function dots(s,cur){
    return s.items.map(function(it,i){ var c=i<cur?(s.res&&s.res[i]==='ok'?'d ok':'d no'):i===cur?'d cur':'d'; return '<span class="'+c+'"></span>'; }).join('');
  }
  function showQ(k){
    var g=G(), s=g.state; if(!s||!s.items) return;
    if(s.n>=s.items.length) return finish(k);
    var q=s.items[s.n]; s.cur=q; s.answered=false; s.res=s.res||[];
    if(k==='vinst') monthShow(); else setCount((s.n+1)+'/'+s.items.length);
    var w=q.w, ans;
    if(q.mode==='type') ans='<div class="ov-input"><input type="text" id="ovIn" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="digite em inglês" onkeydown="if(event.key===\'Enter\'){event.preventDefault();ovCheck();}"><button type="button" class="gm-main" onclick="ovCheck()">Conferir</button></div>';
    else ans='<div class="gm-opts">'+q.opts.map(function(o,i){ return '<button type="button" class="gm-opt" data-i="'+i+'" onclick="ovPick(this)">'+esc(o)+'</button>'; }).join('')+'</div>';
    var sub=k==='vsolve'?'<div class="ov-tag">O que resolve?</div>':k==='vtheme'?'<div class="ov-tag">'+esc(w.tname||'')+(w.grp?' · '+esc(w.grp):'')+'</div>':'';
    body(k,'<div class="ov-play"><div class="ov-l">'+sub+'<p class="ov-q">'+qText(q)+'</p>'+ans+'</div>'+
      '<div class="ov-r"><div class="ov-exp" id="ovExp"><span class="ov-ph">A explicação aparece aqui depois que você responder.</span></div></div></div>'+
      '<div class="ov-foot"><div class="ov-dots">'+dots(s,s.n)+'</div><div id="ovAct"><button type="button" class="ov-skip" onclick="ovSkip()">Pular</button></div></div><div id="gmFb" class="gm-fb" hidden></div>');
    if(q.mode==='listen') setTimeout(function(){ speak(w.en); },250);
    if(q.mode==='type'){ var i=document.getElementById('ovIn'); if(i&&window.innerWidth>700) i.focus(); }
  }
  function after(ok,k,skipped){
    var g=G(), s=g.state, q=s.cur, w=q.w; if(s.answered) return; s.answered=true;
    if(ok) s.ok++;
    s.res[s.n]=ok?'ok':'no';
    s.log.push({en:w.en,pt:w.pt,status:ok?'ok':'rev',ex:w.ex||''});
    if(!ok) bankAdd(w.en,w.pt);
    if(k==='vinst'){ var b=bankGet(), kk=String(w.en).toLowerCase(); if(b[kk]&&ok){ b[kk].ok=(b[kk].ok||0)+1; if(b[kk].ok>=2){ delete b[kk]; if(window.orbLearned) window.orbLearned(w.en,w.pt); } bankSet(b); } if(!skipped) monthBump(ok); }
    var head=ok?'Correto!':skipped?'Pulou essa':'Não foi dessa vez';
    var exp=document.getElementById('ovExp');
    if(exp){ exp.className='ov-exp '+(ok?'is-ok':'is-no');
      exp.innerHTML='<p class="ov-eh">'+head+'</p><p class="ov-ew"><b>'+esc(w.en)+'</b> <button type="button" class="ov-spk" onclick="ovSay(gm.state.cur.w.en)" aria-label="Ouvir">🔊</button> = '+esc(w.pt)+'</p>'+
        (q.mode==='where'&&w.where?'<p class="ov-et">Trabalha em: <b>'+esc(w.where)+'</b>'+(w.wherePt?' ('+esc(w.wherePt)+')':'')+'</p>':'')+
        (q.mode==='opp'&&w.opp?'<p class="ov-et">Oposto: <b>'+esc(w.opp)+'</b></p>':'')+
        (w.tip?'<p class="ov-et">'+esc(w.tip)+'</p>':'')+(w.ex?'<p class="ov-ee">'+esc(w.ex)+'</p>'+(w.exPt?'<p class="ov-ep">'+esc(w.exPt)+'</p>':''):''); }
    var d=document.querySelector('#gmBody .ov-dots'); if(d){ s.res[s.n]=ok?'ok':'no'; d.innerHTML=dots(s,s.n+1); }
    var act=document.getElementById('ovAct');
    if(act) act.innerHTML='<button type="button" class="gm-main" id="ovNextBtn" onclick="ovNext()">'+(s.n+1>=s.items.length?'Ver resultado':'Próxima')+'</button>';
    if(!skipped) speak(w.en);
    var nb=document.getElementById('ovNextBtn'); if(nb) try{ nb.focus({preventScroll:true}); }catch(e){}
  }
  window.ovSkip=function(){ var g=G(), s=g&&g.state; if(!s||s.answered) return;
    [].slice.call(document.querySelectorAll('#gmBody .gm-opt')).forEach(function(b){ b.disabled=true; if(b.textContent===s.cur.ans) b.classList.add('ok'); });
    var i=document.getElementById('ovIn'); if(i){ i.disabled=true; i.value=s.cur.ans; }
    after(false,g.game,true); };
  window.ovPick=function(btn){
    var g=G(), s=g&&g.state; if(!s||s.answered) return;
    var q=s.cur, val=btn.textContent, ok=val===q.ans;
    [].slice.call(btn.parentNode.querySelectorAll('.gm-opt')).forEach(function(b){ b.disabled=true; if(b.textContent===q.ans) b.classList.add('ok'); });
    if(!ok) btn.classList.add('no');
    after(ok,g.game);
  };
  window.ovCheck=function(){
    var g=G(), s=g&&g.state; if(!s||s.answered) return; var i=document.getElementById('ovIn'); if(!i) return;
    var v=norm(i.value); if(!v){ i.focus(); return; }
    var ok=v===norm(s.cur.ans);
    i.disabled=true; i.classList.add(ok?'ok':'no');
    after(ok,g.game);
  };
  window.ovNext=function(){ var g=G(); if(!g||!g.state) return; g.state.n++; showQ(g.game); try{ var m=document.querySelector('#gmBody .ov-play'); if(m&&m.getBoundingClientRect().top<0) m.scrollIntoView({block:'start'}); }catch(e){} };
  /* ---------- placar do mês (Instrutor) ---------- */
  var MKEY='orb-vq-month';
  function monthKey(){ var d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1); }
  function monthGet(){ var m={}; try{ m=JSON.parse(localStorage.getItem(MKEY)||'{}')||{}; }catch(e){} if(m.k!==monthKey()) m={k:monthKey(),ok:0,n:0}; return m; }
  function monthBump(ok){ var m=monthGet(); m.n++; if(ok) m.ok++; try{ localStorage.setItem(MKEY,JSON.stringify(m)); }catch(e){} monthShow(); }
  function monthShow(){ var m=monthGet(); setCount(m.ok+'/'+m.n+' no mês'); }
  /* ---------- Vocabulário por tema ---------- */
  function startTheme(){ openStage('vtheme',themeMenu); }
  var ALL_LV=['A1','A2','B1'];
  function themeLv(){ var v=null; try{ v=JSON.parse(localStorage.getItem('orb-vth-lvs')||'null'); }catch(e){} if(!Array.isArray(v)) v=null; if(v) v=v.filter(function(x){ return ALL_LV.indexOf(x)>=0; }); if(!v||!v.length){ var old=null; try{ old=localStorage.getItem('orb-vth-lv'); }catch(e){} v=old==='all'?ALL_LV.slice():ALL_LV.indexOf(old)>=0?[old]:lvAllowed(); } return ALL_LV.filter(function(x){ return v.indexOf(x)>=0; }); }
  window.ovThemeLv=function(v){ var cur=themeLv(), nxt;
    if(v==='all') nxt=ALL_LV.slice();
    else { var i=cur.indexOf(v); nxt=cur.slice(); if(i>=0){ if(nxt.length>1) nxt.splice(i,1); } else nxt.push(v); }
    try{ localStorage.setItem('orb-vth-lvs',JSON.stringify(nxt)); }catch(e){} themeMenu(); };
  function themeMenu(){
    if(!VB){ body('vtheme','<p class="ov-intro">Carregando o vocabulário…</p>'); return; }
    var lv=themeLv(), allOn=lv.length===ALL_LV.length;
    var chips='<div class="ov-chiprow">'+[['A1','A1'],['A2','A2'],['B1','B1'],['all','Todos']].map(function(c){ return '<button type="button" class="ov-lv'+((c[0]==='all'?allOn:lv.indexOf(c[0])>=0)?' on':'')+'" aria-pressed="'+((c[0]==='all'?allOn:lv.indexOf(c[0])>=0)?'true':'false')+'" onclick="ovThemeLv(\''+c[0]+'\')">'+c[1]+'</button>'; }).join('')+'</div>';
    var cards='<button type="button" class="ov-theme all" onclick="ovTheme(\'all\')">Todos os temas<small>'+allWords().filter(function(w){return lv.indexOf(w.lv)>=0;}).length+' palavras · mistura tudo</small></button>'+
      VB.map(function(t){ var n=t.words.filter(function(w){return lv.indexOf(w.lv)>=0;}).length; return '<button type="button" class="ov-theme" onclick="ovTheme(\''+t.id+'\')">'+esc(t.name)+'<small>'+n+' palavras</small></button>'; }).join('');
    setCount(allOn?'Todos os níveis':lv.join(' + '));
    body('vtheme','<p class="gm-qsub" style="margin:0 0 10px;text-align:center">Escolha um ou mais níveis e o tema. São 10 palavras por rodada.</p>'+chips+'<div class="ov-themes">'+cards+'</div>');
  }
  window.ovTheme=function(tid){
    var g=G(); var lv=themeLv(); var all=allWords().filter(function(w){ return lv.indexOf(w.lv)>=0; });
    var pool=tid==='all'?all:all.filter(function(w){ return w.tid===tid; });
    if(pool.length<4) pool=tid==='all'?allWords():allWords().filter(function(w){ return w.tid===tid; });
    var pick=shuf(pool).slice(0,10);
    g.state={log:[],n:0,ok:0,res:[],theme:tid,items:pick.map(function(w){ return makeQ(w,pool); })};
    showQ('vtheme');
  };
  /* ---------- Instrutor (como no Nexus: banco todo, 2 opções) ---------- */
  function startInst(){ openStage('vinst',instGo); }
  function instGo(){
    var g=G(); var all=allWords();
    if(!all.length){ body('vinst','<p class="ov-intro">Carregando o vocabulário…</p>'); return; }
    var idx={}; all.forEach(function(w){ idx[w.en.toLowerCase()]=w; });
    var mine=shuf(bankList()).map(function(b){ return idx[String(b.en).toLowerCase()]||{en:b.en,pt:b.pt}; }).slice(0,4);
    var seen={}; mine.forEach(function(w){ seen[w.en.toLowerCase()]=1; });
    var rest=shuf(all).filter(function(w){ var k=w.en.toLowerCase(); if(seen[k]) return false; seen[k]=1; return true; }).slice(0,10-mine.length);
    var src=shuf(mine.concat(rest));
    g.state={log:[],n:0,ok:0,res:[],items:src.map(function(w){
      var others=all.filter(function(x){ return x.pt!==w.pt&&x.en.toLowerCase()!==w.en.toLowerCase(); });
      var wrong=others.length?others[Math.floor(Math.random()*others.length)].pt:'outra opção';
      return {w:w,mode:'inst',ans:w.pt,opts:Math.random()<.5?[w.pt,wrong]:[wrong,w.pt]};
    })};
    showQ('vinst');
